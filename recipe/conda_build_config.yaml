# Transitional ABI variant for consumers blocked from Protobuf 7 by HDF5 2.
# Custom keys avoid modifying or overriding conda-forge's global migrations.
cartographer_compat_libabseil:
  - 20260107
cartographer_compat_libprotobuf:
  - 6.33.5

replacements:
  all_replacements:
    - tag: 'pkg-config build metadata'
      glob_patterns:
        - '*.pc'
      regex_re: '(?:-L|-I)?\"?([^;\s]+\/sysroot\/)'
      replacement_re: '$(CONDA_BUILD_SYSROOT_S)'
      regex_rg: '([^;\s"]+/sysroot/)'
    - tag: 'CMake build metadata'
      glob_patterns:
        - '*.cmake'
      regex_re: '([^;\s"]+/sysroot)'
      replacement_re: '$ENV{CONDA_BUILD_SYSROOT}'
    - tag: 'CMake build metadata OSX'
      glob_patterns:
        - '*.cmake'
      regex_re: '([^;\s"]+/MacOSX\d*\.?\d*\.sdk)'
      replacement_re: '$ENV{CONDA_BUILD_SYSROOT}'
